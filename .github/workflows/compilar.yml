name: Compilar Snap7 para ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3 # Se passar de 3 minutos, ele cancela sozinho

    steps:
    - name: Instalar compilador ARM64 e ferramentas
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential g++-aarch64-linux-gnu p7zip-full sed wget

    - name: Baixar e extrair Snap7 v1.4.2 (Link Direto)
      run: |
        mkdir -p snap7-build && cd snap7-build
        # Baixando de um servidor alternativo ultra-rápido livre de bloqueios
        wget -q https://githubusercontent.com
        7z x -y snap7-full-1.4.2.7z > /dev/null

    - name: Compilar para ARM64
      run: |
        cd snap7-build/snap7-full-1.4.2/build/unix
        sed -e 's/x86_64/aarch64/g' -e 's/-m64//g' -e 's/G++ = g++/G++ = aarch64-linux-gnu-g++/g' x86_64_linux.mk > aarch64_linux.mk
        make -f aarch64_linux.mk

    - name: Disponibilizar arquivo para download
      uses: actions/upload-artifact@v4
      with:
        name: libsnap7-arm64
        path: snap7-build/snap7-full-1.4.2/bin/aarch64-linux/libsnap7.so
