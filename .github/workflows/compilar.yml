name: Compilar Snap7 para ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Instalar compilador ARM64 e ferramentas
      run: |
        sudo apt update
        sudo apt install -y build-essential g++-aarch64-linux-gnu sed git

    - name: Clonar código do Snap7 Oficial
      run: |
        git clone https://github.com snap7-source
        # Entrar na pasta correta que o Git cria
        mkdir -p snap7
        mv snap7-source/* snap7/
        mv snap7-source/.[!.]* snap7/ 2>/dev/null || true

    - name: Compilar para ARM64
      run: |
        cd snap7/build/unix
        sed -e 's/x86_64/aarch64/g' -e 's/-m64//g' -e 's/G++ = g++/G++ = aarch64-linux-gnu-g++/g' x86_64_linux.mk > aarch64_linux.mk
        make -f aarch64_linux.mk

    - name: Disponibilizar arquivo para download
      uses: actions/upload-artifact@v4
      with:
        name: libsnap7-arm64
        path: snap7/bin/aarch64-linux/libsnap7.so
