name: Compilar Snap7 para ARM64

on:
  workflow_dispatch: # Permite que você ative a compilação com um clique

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Instalar compilador ARM64 e ferramentas
      run: |
        sudo apt update
        sudo apt install -y build-essential g++-aarch64-linux-gnu p7zip-full sed wget

    - name: Baixar e extrair Snap7
      run: |
        mkdir -p snap7 && cd snap7
        wget -O snap7.7z "https://sourceforge.net"
        7z x -y snap7.7z

    - name: Compilar para ARM64
      run: |
        cd snap7/snap7-full-1.4.2/build/unix
        sed -e 's/x86_64/aarch64/g' -e 's/-m64//g' -e 's/G++ = g++/G++ = aarch64-linux-gnu-g++/g' x86_64_linux.mk > aarch64_linux.mk
        make -f aarch64_linux.mk

    - name: Disponibilizar arquivo para download
      uses: actions/upload-artifact@v4
      with:
        name: libsnap7-arm64
        path: snap7/snap7-full-1.4.2/bin/aarch64-linux/libsnap7.so
